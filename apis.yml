aid: poynt
name: Poynt
description: 'Poynt (GoDaddy Poynt) is an open commerce platform for merchants built
  around smart payment terminals and a cloud API. Its Poynt Cloud API (services.poynt.net)
  lets developers build and distribute business apps that read and write orders, transactions,
  customers, products, catalogs, inventory, taxes and businesses, register webhooks
  for real-time events, and tokenize card data in the browser with Poynt Collect.
  Authentication is OAuth 2.0 using a self-signed JWT bearer grant that is exchanged
  for a short-lived access token. The platform serves three integration audiences:
  payment processors, terminal OEMs, and independent app developers.'
